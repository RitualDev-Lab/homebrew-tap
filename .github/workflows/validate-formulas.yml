name: Validate Homebrew Formulas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  validate-formulas:
    name: Ruby Syntax & SHA-256 Integrity Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check Ruby syntax across all formulas
        run: |
          set -euo pipefail
          for f in Formula/*.rb; do
            echo "Checking syntax: $f"
            ruby -c "$f"
          done

      - name: Verify live URL reachability and SHA-256 checksums
        run: |
          python3 - <<'PY'
          import hashlib, glob, re, sys, urllib.request

          EMPTY_SHA256 = "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
          errors = []

          for path in sorted(glob.glob("Formula/*.rb")):
              text = open(path, encoding="utf-8").read()
              url_m = re.search(r'^\s*url\s+"([^"]+)"', text, re.M)
              sha_m = re.search(r'^\s*sha256\s+"([0-9a-fA-F]{64})"', text, re.M)
              if not url_m or not sha_m:
                  errors.append(f"{path}: missing url or 64-char sha256")
                  continue
              url = url_m.group(1)
              expected = sha_m.group(1).lower()
              if expected == EMPTY_SHA256:
                  errors.append(f"{path}: placeholder empty-file sha256 detected")
                  continue
              req = urllib.request.Request(url, headers={"User-Agent": "RitualDev-Homebrew-CI/1.0"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      data = resp.read()
                  actual = hashlib.sha256(data).hexdigest()
                  if actual != expected:
                      errors.append(f"{path}: SHA-256 mismatch for {url}\n  expected: {expected}\n  actual:   {actual}")
                  else:
                      print(f"OK {path} ({len(data)} bytes) sha256={actual[:16]}...")
              except Exception as exc:
                  errors.append(f"{path}: failed fetching {url}: {exc}")

          if errors:
              print("\nFAILURES:\n" + "\n".join(errors), file=sys.stderr)
              sys.exit(1)
          print("\nAll Homebrew formulas passed syntax and SHA-256 verification.")
          PY
